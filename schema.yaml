  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: |-
        Nicknames `request.user` as `self.user` on any view that
        inherits this. Purely a convenience — no behavior change.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
