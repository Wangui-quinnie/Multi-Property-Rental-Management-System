components:
  schemas:
    BillingPeriod:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BillingPeriodStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - due_date
      - end_date
      - id
      - name
      - start_date
      - status
      - updated_at
    BillingPeriodStatusEnum:
      enum:
      - OPEN
      - CLOSED
      type: string
      description: |-
        * `OPEN` - Open
        * `CLOSED` - Closed
    BillingPeriodWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/BillingPeriodStatusEnum'
      required:
      - due_date
      - end_date
      - name
      - start_date
    CashFlowEntry:
      type: object
      properties:
        month:
          type: string
        total_collected:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - month
      - total_collected
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
